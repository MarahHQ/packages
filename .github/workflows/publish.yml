# Builds the DNF and APT repositories from Marah Launcher's latest releases and publishes them on
# GitHub Pages, at https://marahhq.github.io/packages. Daily, by hand, and when the Marah Bot
# starts it after a release. The metadata is signed with the organization secret
# PACKAGES_SIGNING_KEY (an armored GPG private key with no passphrase); without it nothing is
# published, as unsigned repositories would teach users to turn the checks off.
name: Publish

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.key.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the signing key set?
        id: key
        env:
          KEY_SET: ${{ secrets.PACKAGES_SIGNING_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::notice::PACKAGES_SIGNING_KEY isn't set: nothing is published"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tools
        if: steps.key.outputs.ready == 'true'
        run: sudo apt-get update -q && sudo apt-get install -yq createrepo-c apt-utils
      - name: Build
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          scripts/build-repo.sh site "$key"
      - if: steps.key.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
